<section class="page-container feed">
  <h2>{{ section().title }}</h2>

  <ul class="grid">
    @for (product of items(); track product.id) {
      <li>
        <app-product-card
          [product]="product"
          (impression)="trackProduct('product_impression', product.id, $index)"
          (opened)="trackProduct('product_click', product.id, $index)"
        />
      </li>
    }
    @if (status() === 'loading') {
      @for (i of [1, 2, 3, 4, 5]; track i) {
        <li><app-product-card-skeleton /></li>
      }
    }
  </ul>

  <div class="sentinel" (appInViewport)="onSentinelVisible($event)"></div>

  @if (status() === 'error') {
    <app-load-error message="商品載入失敗" (retry)="retry()" />
  } @else if (showButton() && status() === 'idle') {
    <div class="more">
      @if (hasMore()) {
        <button type="button" (click)="loadMore()">
          看更多
          <svg class="chevron" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true">
            <path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.5" />
          </svg>
        </button>
      } @else {
        <button type="button" disabled>已經沒有新商品了</button>
      }
    </div>
  }
</section>
